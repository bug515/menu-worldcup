<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 월드컵 v2.1</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f8f9fa; --selected: #2ecc71; --bye: #f39c12; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; resize: none; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        button { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; }
        #game-area, #result-area { display: none; }
        .match-container { display: flex; gap: 15px; margin-top: 20px; min-height: 150px; }
        .card { flex: 1; background: #fff; border: 2px solid #eee; padding: 30px 10px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 20px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; text-align: center; }
        .card.active-select { border-color: var(--selected); background: #e8f8f0; transform: scale(1.05); }
        .vs { display: flex; align-items: center; font-weight: bold; color: #999; }
        .round-info { background: #eee; padding: 5px 15px; border-radius: 20px; font-size: 14px; color: #666; display: inline-block; margin-bottom: 10px; }
        #bye-msg { color: var(--bye); font-weight: bold; font-size: 14px; margin: 10px 0; min-height: 20px; }
        #result-text { font-size: 32px; color: var(--primary); margin: 20px 0; font-weight: 800; }
    </style>
</head>
<body>
<div class="container">
    <div id="setup-area">
        <h2>🍴 메뉴 월드컵</h2>
        <textarea id="menu-input" placeholder="메뉴를 한 줄에 하나씩 입력..."></textarea>
        <button onclick="initGame()">월드컵 시작하기</button>
    </div>
    <div id="game-area">
        <div class="round-info" id="round-title">강</div>
        <div id="bye-msg"></div>
        <div class="match-container">
            <div class="card" onclick="handleSelect(0, this)" id="choice1"></div>
            <div class="vs">VS</div>
            <div class="card" onclick="handleSelect(1, this)" id="choice2"></div>
        </div>
        <p id="match-count" style="margin-top:20px; color:#999; font-size:13px;"></p>
    </div>
    <div id="result-area">
        <h2>🏆 최종 우승 메뉴</h2>
        <div id="result-text"></div>
        <button onclick="restartGame()" style="background:#666;">입력창으로 돌아가기</button>
    </div>
</div>
<script>
    let items = [], winners = [], currentIndex = 0, isProcessing = false;
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    function initGame() {
        const text = document.getElementById('menu-input').value.trim();
        if (!text) { alert("메뉴를 입력해주세요!"); return; }
        items = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        if (items.length < 2) { alert("최소 2개 이상의 메뉴가 필요합니다."); return; }
        document.getElementById('setup-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        winners = [];
        startNewRound();
    }
    function startNewRound() {
        currentIndex = 0;
        document.getElementById('bye-msg').innerText = "";
        shuffle(items);
        if (items.length === 1) { showResult(items[0]); return; }
        if (items.length % 2 !== 0) {
            const byeItem = items.pop();
            winners.push(byeItem);
            document.getElementById('bye-msg').innerText = `✨ 이번 라운드 부전승: ${byeItem}`;
        }
        document.getElementById('round-title').innerText = `${items.length + (items.length % 2 === 0 ? 0 : 1)}강 진행 중`;
        updateMatchUI();
    }
    function updateMatchUI() {
        if (currentIndex >= items.length) {
            items = [...winners]; winners = []; startNewRound(); return;
        }
        document.getElementById('choice1').innerText = items[currentIndex];
        document.getElementById('choice2').innerText = items[currentIndex + 1];
        document.getElementById('choice1').classList.remove('active-select');
        document.getElementById('choice2').classList.remove('active-select');
        document.getElementById('match-count').innerText = `현재 경기: ${Math.floor(currentIndex/2) + 1} / ${Math.floor(items.length/2)}`;
        isProcessing = false;
    }
    function handleSelect(n, element) {
        if (isProcessing) return;
        isProcessing = true;
        element.classList.add('active-select');
        setTimeout(() => {
            winners.push(items[currentIndex + n]);
            currentIndex += 2;
            updateMatchUI();
        }, 500);
    }
    function showResult(winner) {
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('result-text').innerText = winner;
    }
    function restartGame() {
        document.getElementById('result-area').style.display = 'none';
        document.getElementById('setup-area').style.display = 'block';
    }
</script>
</body>
</html>
